name: Build Windows installer
on:
  workflow_dispatch:
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build application and installer
        shell: pwsh
        run: ./tools/Build-WindowsInstaller.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectPilot-Python-3.0.1-Windows-Setup
          path: installers/*.exe
          if-no-files-found: error
